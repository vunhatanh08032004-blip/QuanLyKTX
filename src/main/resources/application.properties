spring.application.name=QuanLyKTX

# ----------------------------------------------------
# CẤU HÌNH KẾT NỐI DATABASE MYSQL
# ----------------------------------------------------
# Tên database trong file QuanLyKTX.sql là QuanLyKyTucXa
spring.datasource.url=jdbc:mysql://localhost:3306/QuanLyKyTucXa?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

# Tài khoản & Mật khẩu đăng nhập MySQL Workbench / XAMPP của máy bạn
spring.datasource.username=root
spring.datasource.password=1234

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ----------------------------------------------------
# CẤU HÌNH SPRING DATA JPA / HIBERNATE
# ----------------------------------------------------
spring.jpa.hibernate.ddl-auto=update

# Giữ nguyên tên bảng/cột đúng như file SQL (VD: TaiKhoan, MaTaiKhoan),
# không tự đổi sang snake_case (tai_khoan, ma_tai_khoan)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ----------------------------------------------------
# THYMELEAF
# ----------------------------------------------------
spring.thymeleaf.cache=false
