<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/auth-layout :: authlayout(~{::title}, ~{::main})}">
<head>
  <title>Đặt lại mật khẩu | Quản lý KTX</title>
</head>
<body>
<main>
  <h2 class="auth-title">Đặt lại mật khẩu</h2>
  <p class="auth-sub">Xác minh thành công. Nhập mật khẩu mới (có hiệu lực trong 10 phút).</p>

  <form th:action="@{/reset-password}" th:object="${form}" method="post" novalidate>
    <div class="field">
      <label for="matKhau">Mật khẩu mới</label>
      <div class="input-icon">
        <svg class="ic"><use href="#i-lock"/></svg>
        <input type="password" id="matKhau" th:field="*{matKhau}" placeholder="Ít nhất 6 ký tự" autocomplete="new-password" th:errorclass="is-invalid">
      </div>
      <div class="field-error" th:if="${#fields.hasErrors('matKhau')}" th:errors="*{matKhau}"></div>
    </div>
    <div class="field">
      <label for="xacNhanMatKhau">Nhập lại mật khẩu mới</label>
      <div class="input-icon">
        <svg class="ic"><use href="#i-lock"/></svg>
        <input type="password" id="xacNhanMatKhau" th:field="*{xacNhanMatKhau}" placeholder="Nhập lại mật khẩu" autocomplete="new-password" th:errorclass="is-invalid">
      </div>
      <div class="field-error" th:if="${#fields.hasErrors('xacNhanMatKhau')}" th:errors="*{xacNhanMatKhau}"></div>
    </div>
    <button type="submit" class="btn-primary-app btn-block">Đổi mật khẩu</button>
  </form>

  <p class="auth-switch"><a th:href="@{/login}">&larr; Quay lại đăng nhập</a></p>
</main>
</body>
</html>
