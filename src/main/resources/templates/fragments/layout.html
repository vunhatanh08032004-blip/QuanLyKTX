<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head>
  <title th:replace="${title}">Hệ thống Quản lý KTX</title>
  <th:block th:replace="~{fragments/head :: assets}"/>
</head>
<body>
  <th:block th:replace="~{fragments/icons :: sprite}"/>
  <div th:replace="~{fragments/header :: header}"></div>

  <div class="app-shell">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <div class="app-content">
      <!-- Thông báo dùng chung: controller chỉ cần addFlashAttribute("success", "...") / ("error", "...") -->
      <div class="flash flash-success" th:if="${success}" th:text="${success}"></div>
      <div class="flash flash-error" th:if="${error}" th:text="${error}"></div>

      <!-- NỘI DUNG TỪNG MODULE ĐƯỢC CHÈN VÀO ĐÂY -->
      <th:block th:replace="${content}"/>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script th:src="@{/js/app.js}"></script>
</body>
</html>
