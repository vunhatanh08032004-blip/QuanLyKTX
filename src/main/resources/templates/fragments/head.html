<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- CSS/JS dùng chung. Đặt trong <head> của mỗi trang: <th:block th:replace="~{fragments/head :: assets}"/> -->
<th:block th:fragment="assets">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap 5 (cho các thành viên dùng grid/table/modal trong phần content) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <!-- CSS của khung chung: luôn nạp SAU Bootstrap -->
  <link rel="stylesheet" th:href="@{/css/app.css}">
</th:block>
</body>
</html>
